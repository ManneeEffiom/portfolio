app = "portfolio-celery"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[worker]
  # Celery worker consuming Upstash Redis (broker + result backend)
  command = "celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2"
  processes = ["worker"]

[[env]]
  key = "PYTHON_VERSION"
  value = "3.11"

# Worker consumes the broker, so eager must be OFF here.
# UPSTASH_REDIS_URL is provided via `fly secrets set` (never commit it).
[[env]]
  key = "CELERY_TASK_ALWAYS_EAGER"
  value = "False"

[deploy]
  release_command = "echo 'celery worker ready'"
